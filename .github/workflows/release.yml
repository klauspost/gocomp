name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so goreleaser can build the changelog, and so the tag
          # reaches debug.BuildInfo: "gocomp version" reads it from there.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go tool task test:race

      - uses: goreleaser/goreleaser-action@v6
        with:
          # ~> v2 rather than latest: .goreleaser.yml uses the v2 schema, and a
          # v3 that renames fields should not break a release unannounced.
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
